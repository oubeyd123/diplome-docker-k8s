apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: diplomes
  labels: { app: api }
spec:
  # No "replicas" here: the HorizontalPodAutoscaler at the end of this file decides
  # how many api pods run (between minReplicas and maxReplicas).
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: diplome-api:1.0
          imagePullPolicy: IfNotPresent   # image is built inside Minikube (see scripts/deploy.sh)
          ports:
            - containerPort: 4000
          env:
            # MONGO_USER / MONGO_PASSWORD must be declared before MONGO_URI to be used in it.
            - name: MONGO_USER
              valueFrom: { secretKeyRef: { name: diplomes-secret, key: mongo-user } }
            - name: MONGO_PASSWORD
              valueFrom: { secretKeyRef: { name: diplomes-secret, key: mongo-password } }
            - name: MONGO_URI
              value: mongodb://$(MONGO_USER):$(MONGO_PASSWORD)@mongo:27017/diplomes?authSource=admin
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: diplomes-secret, key: jwt-secret } }
            - name: ADMIN_EMAIL
              valueFrom: { secretKeyRef: { name: diplomes-secret, key: admin-email } }
            - name: ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: diplomes-secret, key: admin-password } }
          # Ready = connected to MongoDB. Not ready pods receive no traffic.
          readinessProbe:
            httpGet: { path: /api/health, port: 4000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          # Restarted by Kubernetes if it stops answering.
          livenessProbe:
            httpGet: { path: /api/health, port: 4000 }
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 4
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
# One stable address "api:4000" in front of all API pods: load balancing happens here.
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: diplomes
spec:
  type: ClusterIP
  selector: { app: api }
  ports:
    - port: 4000
      targetPort: 4000
---
# Automatic scaling of the api pods based on CPU load.
# Needs the metrics-server addon (deploy.bat enables it) to measure CPU.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: diplomes
spec:
  scaleTargetRef:            # what to scale: the "api" Deployment above
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2             # never fewer than 2 pods, even with no traffic
  maxReplicas: 6             # never more than 6 pods, even under heavy load
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50   # add pods when average CPU > 50% of the requested 50m
