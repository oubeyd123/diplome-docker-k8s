# Credentials used by mongo and the API. Demo values: change them for anything real.
# Avoid special characters in the Mongo password (it is placed inside a connection URI).
apiVersion: v1
kind: Secret
metadata:
  name: diplomes-secret
  namespace: diplomes
type: Opaque
stringData:
  mongo-user: root
  mongo-password: example
  jwt-secret: change-me-in-real-life
  admin-email: admin@univ.local
  admin-password: admin1234
