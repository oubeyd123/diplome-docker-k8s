apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: diplomes
  labels: { app: frontend }
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: diplome-frontend:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            periodSeconds: 5
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
---
# NodePort: the only component reachable from outside the cluster.
# nginx inside this pod forwards /api to the "api" Service.
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: diplomes
spec:
  type: NodePort
  selector: { app: frontend }
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
