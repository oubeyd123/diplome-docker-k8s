apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: diplomes
  labels: { app: frontend }
spec:
  replicas: 2                # 2 copies: if one pod dies, the other keeps the site online
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: diplome-frontend:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          # Ready = nginx answers. Not ready pods receive no traffic.
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            periodSeconds: 5
          # Restarted by Kubernetes if nginx stops answering.
          livenessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 4
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
---
# NodePort: the only component reachable from outside the cluster.
# nginx inside this pod forwards /api to the "api" Service.
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: diplomes
spec:
  type: NodePort
  selector: { app: frontend }
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
