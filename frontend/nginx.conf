server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  # PDFs up to 5 MB + form fields
  client_max_body_size 6m;

  # The browser talks to /api on the same origin; nginx forwards it to the API
  # service (the name "api" resolves in Docker Compose and in Kubernetes).
  location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hashed assets can be cached for a long time
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Single page app: unknown paths return index.html
  location / {
    try_files $uri /index.html;
  }
}
